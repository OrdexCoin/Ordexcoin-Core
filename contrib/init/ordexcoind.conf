description "OrdexCoin Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env ORDEXCOIND_BIN="/usr/bin/ordexcoind"
env ORDEXCOIND_USER="ordexcoin"
env ORDEXCOIND_GROUP="ordexcoin"
env ORDEXCOIND_PIDDIR="/var/run/ordexcoind"
# upstart can't handle variables constructed with other variables
env ORDEXCOIND_PIDFILE="/var/run/ordexcoind/ordexcoind.pid"
env ORDEXCOIND_CONFIGFILE="/etc/ordexcoin/ordexcoin.conf"
env ORDEXCOIND_DATADIR="/var/lib/ordexcoind"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # ordexcoind will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$ORDEXCOIND_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run ordexcoind."
        echo "The setting must appear in $ORDEXCOIND_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"OrdexCoin Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$ORDEXCOIND_PIDDIR"
    chmod 0755 "$ORDEXCOIND_PIDDIR"
    chown $ORDEXCOIND_USER:$ORDEXCOIND_GROUP "$ORDEXCOIND_PIDDIR"
    chown $ORDEXCOIND_USER:$ORDEXCOIND_GROUP "$ORDEXCOIND_CONFIGFILE"
    chmod 0660 "$ORDEXCOIND_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$ORDEXCOIND_PIDFILE" \
    --chuid $ORDEXCOIND_USER:$ORDEXCOIND_GROUP \
    --exec "$ORDEXCOIND_BIN" \
    -- \
    -pid="$ORDEXCOIND_PIDFILE" \
    -conf="$ORDEXCOIND_CONFIGFILE" \
    -datadir="$ORDEXCOIND_DATADIR" \
    -disablewallet \
    -daemon

